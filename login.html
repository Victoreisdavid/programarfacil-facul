<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content=""width=device-width, inicial-scale="1.0">
        <link rel="stylesheet" href="styles/login2.css">
        <title> Programar Fácil - Login </title>
    </head>

<body>
    <header id="cabecalho">
        <div class="circle_container_mask"></div>
        <div id="content">
            <h1>LOGIN</h1>
            <form action="/home.html" method="get">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required placeholder="Digite seu email:">
                <input type="password" name="senha" id="senha" required placeholder="Digite sua senha:">
                <button>Login</button>
                <button>Cadastre-se</button>
            </form>
        </div>
    </header>

    <main id="grupo">
        <section id="cabecalho2">
            <h2>Seja aluno do Programar Fácil</h2>
            <p>São mais de mil cursos para ajudar a construir sua carreira como programador nas seguintes áreas:</p>
        </section>

        <section id="categorias">
            <ul>
                <li class="categoria">
                    <img src="/img/window-dev.svg" alt="">
                    <h3>Desenvolvimento Web</h3>
                </li>

                <li class="categoria">
                    <img src="img/algoritmo.png" alt="">
                    <h3>Algoritmos e Lógica de Programação</h3>
                </li>

                <li class="categoria">
                    <img src="img/ai-svgrepo-com.svg" alt="">
                    <h3>Inteligência Artificial</h3>
                </li>

                <li class="categoria">
                    <img src="img/data-science-solid-svgrepo-com.svg" alt="">
                    <h3>Banco de Dados</h3>
                </li>
            </ul>
        </section>
    </main>
</body>
